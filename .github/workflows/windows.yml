name: Cartridge for Windows
# Public Windows verification is manual; regular CI runs on self-hosted Gitea.
# Build locally first, then dispatch this native Windows install/runtime check.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Build the portable app and installer
        run: npm run dist
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Record portable and installer checksums
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $products = @(Get-ChildItem -Path 'dist/Cartridge-Windows-*.exe')
          if ($products.Count -ne 2) { throw 'Expected portable and installer executables before recording checksums' }
          $products | ForEach-Object {
            (Get-FileHash -LiteralPath $_.FullName -Algorithm SHA256).Hash.ToLowerInvariant() + '  ' + $_.Name
          } | Set-Content -LiteralPath 'dist/SHA256SUMS' -Encoding ascii
      - name: Prove packaged, portable and installed desktop behavior
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          function Invoke-Smoke([string]$Executable, [string]$Name) {
            $proof = Join-Path $env:RUNNER_TEMP ('cartridge-proof-' + $Name + '-' + [guid]::NewGuid().ToString('N'))
            New-Item -ItemType Directory -Path $proof | Out-Null
            $process = $null
            try {
              $process = Start-Process -FilePath $Executable -ArgumentList ('"--smoke-test=' + $proof + '"') -PassThru -WindowStyle Hidden
              $deadline = (Get-Date).AddSeconds(120)
              while ((Get-Date) -lt $deadline) {
                if (Test-Path -LiteralPath (Join-Path $proof 'smoke-failed.txt')) {
                  Get-Content -LiteralPath (Join-Path $proof 'smoke-failed.txt')
                  throw "Desktop smoke failed: $Name"
                }
                $report = Join-Path $proof 'smoke-passed.json'
                if (Test-Path -LiteralPath $report) {
                  $result = Get-Content -LiteralPath $report -Raw | ConvertFrom-Json
                  foreach ($field in @('nativeWindow','setup','remoteConsole','remoteIpcDenied','unsafeUrlDenied','plaintextPasswordAbsent')) {
                    if ($result.$field -isnot [bool] -or $result.$field -ne $true) { throw "Missing or false proof field: $Name/$field" }
                  }
                  if ($result.optionalRetroArch -isnot [bool] -or $result.optionalRetroArch -ne $false) { throw 'Standard build unexpectedly depends on RetroArch' }
                  $screenshot = Join-Path $proof 'setup.png'
                  if (-not (Test-Path -LiteralPath $screenshot -PathType Leaf) -or (Get-Item -LiteralPath $screenshot).Length -eq 0) { throw "Setup screenshot missing: $Name" }
                  Write-Host "PASS: $Name native desktop, setup, remote console, IPC isolation, unsafe URL rejection, password absence and screenshot."
                  return $result
                }
                Start-Sleep -Milliseconds 500
              }
              throw "Desktop smoke timed out: $Name"
            } finally {
              if ($process -and -not $process.HasExited) { & taskkill.exe /PID $process.Id /T /F | Out-Null }
              $evidence = Join-Path $env:GITHUB_WORKSPACE ('proof/' + $Name)
              New-Item -ItemType Directory -Path $evidence -Force | Out-Null
              Get-ChildItem -LiteralPath $proof -File | Where-Object Name -in @('smoke-passed.json','smoke-failed.txt','setup.png') | Copy-Item -Destination $evidence
            }
          }
          function Assert-OwnedInstall([string]$Path) {
            $tempRoot = [IO.Path]::GetFullPath($env:RUNNER_TEMP).TrimEnd([IO.Path]::DirectorySeparatorChar) + [IO.Path]::DirectorySeparatorChar
            $resolved = [IO.Path]::GetFullPath($Path)
            if (-not $resolved.StartsWith($tempRoot, [StringComparison]::OrdinalIgnoreCase) -or [IO.Path]::GetFileName($resolved) -ne 'CartridgeInstalledSmoke') {
              throw 'Installer fixture must stay inside RUNNER_TEMP/CartridgeInstalledSmoke'
            }
            return $resolved
          }
          Invoke-Smoke (Join-Path $env:GITHUB_WORKSPACE 'dist/win-unpacked/Cartridge.exe') 'packaged' | Out-Null
          $portable = @(Get-ChildItem -Path 'dist/Cartridge-Windows-Portable-*.exe')
          $installer = @(Get-ChildItem -Path 'dist/Cartridge-Windows-Setup-*.exe')
          if ($portable.Count -ne 1 -or $installer.Count -ne 1) { throw 'Expected exactly one portable and one NSIS installer artifact' }
          Invoke-Smoke $portable[0].FullName 'portable' | Out-Null
          $installRoot = Assert-OwnedInstall (Join-Path $env:RUNNER_TEMP 'CartridgeInstalledSmoke')
          if (Test-Path -LiteralPath $installRoot) { throw 'Installer fixture already exists; refusing to alter it' }
          $installerProof = [ordered]@{ installExitCode = $null; perUserRegistry = $false; installedSmoke = $false; uninstallExitCode = $null; applicationRemoved = $false; registryRemoved = $false }
          $ownedUninstaller = $null
          $registryPath = $null
          try {
            # NSIS requires /D to be the final argument; this path has no added quotes.
            $install = Start-Process -FilePath $installer[0].FullName -ArgumentList @('/S','/currentuser',('/D=' + $installRoot)) -PassThru -Wait -WindowStyle Hidden
            $installerProof.installExitCode = $install.ExitCode
            if ($install.ExitCode -ne 0) { throw "Silent NSIS installation failed: $($install.ExitCode)" }
            $installedExe = Join-Path $installRoot 'Cartridge.exe'
            if (-not (Test-Path -LiteralPath $installedExe -PathType Leaf)) { throw 'Installer did not create the expected executable in the owned fixture' }
            $uninstallers = @(Get-ChildItem -LiteralPath $installRoot -File -Filter 'Uninstall*.exe')
            if ($uninstallers.Count -ne 1) { throw 'Expected one uninstaller inside the owned fixture' }
            $ownedUninstaller = $uninstallers[0].FullName
            $uninstallPrefix = '"' + $ownedUninstaller + '"'
            $entries = @(Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\*' -ErrorAction SilentlyContinue | Where-Object {
              $_.UninstallString -and $_.UninstallString.StartsWith($uninstallPrefix, [StringComparison]::OrdinalIgnoreCase) -and $_.UninstallString.Contains('/currentuser')
            })
            if ($entries.Count -ne 1) { throw 'The owned installer was not registered as a per-user installation' }
            $registryPath = $entries[0].PSPath
            $installerProof.perUserRegistry = $true
            Invoke-Smoke $installedExe 'installed' | Out-Null
            $installerProof.installedSmoke = $true
          } finally {
            try {
              if ($ownedUninstaller -and (Test-Path -LiteralPath $ownedUninstaller)) {
                $verifiedRoot = Assert-OwnedInstall $installRoot
                if (-not [IO.Path]::GetDirectoryName([IO.Path]::GetFullPath($ownedUninstaller)).Equals($verifiedRoot, [StringComparison]::OrdinalIgnoreCase)) { throw 'Uninstaller escaped its owned fixture' }
                $uninstall = Start-Process -FilePath $ownedUninstaller -ArgumentList @('/S','/currentuser') -PassThru -Wait -WindowStyle Hidden
                $installerProof.uninstallExitCode = $uninstall.ExitCode
                $deadline = (Get-Date).AddSeconds(30)
                while ((Get-Date) -lt $deadline -and ((Test-Path -LiteralPath (Join-Path $verifiedRoot 'Cartridge.exe')) -or ($registryPath -and (Test-Path -LiteralPath $registryPath)))) { Start-Sleep -Milliseconds 500 }
                $installerProof.applicationRemoved = -not (Test-Path -LiteralPath (Join-Path $verifiedRoot 'Cartridge.exe'))
                $installerProof.registryRemoved = $registryPath -and -not (Test-Path -LiteralPath $registryPath)
              }
            } catch { $installerProof['uninstallError'] = $_.Exception.Message }
            New-Item -ItemType Directory -Path 'proof' -Force | Out-Null
            $installerProof | ConvertTo-Json | Set-Content -LiteralPath 'proof/installer-proof.json' -Encoding utf8
          }
          if ($installerProof.uninstallExitCode -ne 0 -or -not $installerProof.applicationRemoved -or -not $installerProof.registryRemoved) { throw 'Owned fixture did not uninstall cleanly' }
          Write-Host 'PASS: silent per-user NSIS install, actual installed app and quiet uninstall.'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Cartridge-Windows-x64
          if-no-files-found: error
          path: |
            dist/Cartridge-Windows-*.exe
            dist/SHA256SUMS
            proof/**
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: Cartridge-Windows-x64
          path: artifacts
      - name: Publish verified Windows executables
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release view "$RELEASE_TAG" >/dev/null 2>&1 || gh release create "$RELEASE_TAG" --verify-tag --title "Cartridge for Windows $RELEASE_TAG" --notes "Windows x64 desktop companion for your own RomM server. Includes a portable app and per-user installer. This is an unsigned community build; no Python, Node.js or administrator setup is required. RetroArch is optional and is not included in this release."
          find artifacts \( -name 'Cartridge-Windows-*.exe' -o -name SHA256SUMS \) -exec gh release upload "$RELEASE_TAG" {} --clobber \;
